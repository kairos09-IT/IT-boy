<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairos Type</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">⌨️ Kairos Type</div>

    <nav>
        <button class="nav-btn active" data-page="practice">Practice</button>
        <button class="nav-btn" data-page="courses">Courses</button>
        <button class="nav-btn" data-page="settings">Settings</button>
    </nav>
</header>

<main>

    <!-- PRACTICE -->
    <section id="practice" class="page active">

        <div class="top-info">
            <div>
                <span>WPM</span>
                <strong id="wpm">0</strong>
            </div>

            <div>
                <span>Accuracy</span>
                <strong id="accuracy">100%</strong>
            </div>

            <div>
                <span>Errors</span>
                <strong id="errors">0</strong>
            </div>

            <div>
                <span>Time</span>
                <strong id="timer">60</strong>
            </div>
        </div>

        <div class="lesson-title">
            <p>Current Lesson</p>
            <h1 id="lessonName">Home Row Basics</h1>
        </div>

        <div id="textDisplay" class="text-display"></div>

        <textarea
            id="typingInput"
            placeholder="Start typing here..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false">
        </textarea>

        <div class="target-box">
            Target WPM:
            <strong id="targetWpm">40</strong>
            WPM
        </div>

        <!-- KEYBOARD -->
        <div id="keyboard" class="keyboard"></div>

        <div class="practice-buttons">
            <button id="restartBtn">↻ Restart</button>
            <button id="nextBtn">Next Lesson →</button>
        </div>

        <div id="result" class="result hidden">
            <h2>Lesson Complete 🎉</h2>
            <p>Your speed: <strong id="finalWpm">0</strong> WPM</p>
            <p>Your accuracy: <strong id="finalAccuracy">0%</strong></p>
            <button id="againBtn">Practice Again</button>
        </div>

    </section>


    <!-- COURSES -->
    <section id="courses" class="page">

        <div class="section-heading">
            <p>Learn step by step</p>
            <h1>Typing Courses</h1>
        </div>

        <div id="courseList" class="course-list"></div>

    </section>


    <!-- SETTINGS -->
    <section id="settings" class="page">

        <div class="section-heading">
            <p>Customize your experience</p>
            <h1>Keyboard & Settings</h1>
        </div>

        <div class="settings-card">

            <label>
                Keyboard Layout
                <select id="keyboardLayout">
                    <option value="qwerty">QWERTY</option>
                    <option value="azerty">AZERTY</option>
                    <option value="qwertz">QWERTZ</option>
                </select>
            </label>

            <label>
                Target WPM
                <input
                    id="wpmInput"
                    type="number"
                    min="10"
                    max="200"
                    value="40">
            </label>

            <label>
                Lesson Time
                <select id="timeSetting">
                    <option value="30">30 seconds</option>
                    <option value="60" selected>60 seconds</option>
                    <option value="120">120 seconds</option>
                </select>
            </label>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
